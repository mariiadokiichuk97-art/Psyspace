  c.innerHTML='<div class="profile-top"><button class="secondary" id="backClients">← До клієнтів</button><div><h2 style="margin:0">'+esc(cl.name||"Картка клієнта")+'</h2><span class="muted">'+esc(cl.status||"")+'</span></div></div><div class="profile-tabs">'+profileTabs.map(([k,v])=>'<button data-profile-tab="'+k+'" class="'+(profileTab===k?'active':'')+'">'+v+'</button>').join("")+'</div>'+body;
  $("#backClients").onclick=()=>{selectedClientId=null;render()};
  c.querySelectorAll("[data-profile-tab]").forEach(b=>b.onclick=()=>{profileTab=b.dataset.profileTab;renderClientProfile()});
  const gf=$("#goalsForm");if(gf)gf.onsubmit=async e=>{e.preventDefault();const next=new FormData(gf).get("goals").split("\n").map(x=>x.trim()).filter(Boolean);await updateClientPayload(cl,{goals:next});renderClientProfile()};
  const ff=$("#formulationForm");if(ff)ff.onsubmit=async e=>{e.preventDefault();const saveBtn=ff.querySelector('button[type="submit"],button:not([type])');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent="Зберігаємо…"}try{const fd=Object.fromEntries(new FormData(ff));const changed=JSON.stringify(f)!==JSON.stringify(fd);let history=hist.slice();if(changed){const hasOld=Object.values(f).some(v=>String(v||"").trim());if(hasOld)history.push({...f,savedAt:new Date().toLocaleString("uk-UA")});else history.push({...fd,savedAt:new Date().toLocaleString("uk-UA"),versionLabel:"Перша версія"});}await updateClientPayload(cl,{caseFormulation:fd,formulationHistory:history});const fresh=await data("clients");const saved=fresh.find(x=>String(x.id)===String(cl.id));if(!saved||stableJson(saved.caseFormulation||{})!==stableJson(fd))throw Error("База даних не підтвердила збереження. Перевірте підключення та спробуйте ще раз.");await renderClientProfile();const notice=document.createElement("div");notice.className="notice";notice.textContent="Зміни збережено та перевірено в базі даних.";$("#content").prepend(notice);}catch(err){if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="Зберегти формулювання"}let msg=$("#formSaveError");if(!msg){msg=document.createElement("div");msg.id="formSaveError";msg.className="notice";ff.prepend(msg)}msg.textContent="Не вдалося підтвердити збереження: "+err.message;}};
  const ss=$("#profileScale");if(ss)ss.onchange=()=>{const r=ca.filter(x=>x.scale===ss.value).sort((a,b)=>String(a.date).localeCompare(String(b.date)));$("#scoreChart").innerHTML=assessmentChart(r)};
 }catch(e){c.innerHTML='<div class="notice">Не вдалося відкрити картку: '+esc(e.message)+'</div>'}
}
async function updateClientPayload(cl,patch){
 const payload={...cl};delete payload.id;await req("/rest/v1/clients?id=eq."+encodeURIComponent(cl.id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({payload:{...payload,...patch}})});
}
function stableJson(v){if(Array.isArray(v))return "["+v.map(stableJson).join(",")+"]";if(v&&typeof v==="object")return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stableJson(v[k])).join(",")+"}";return JSON.stringify(v)}
function assessmentChart(rows){
 if(!rows.length)return '<div class="empty">Для цієї шкали ще немає записів.</div>';
 const W=620,H=230,L=42,R=18,T=16,B=44,vals=rows.map(x=>Number(x.score)).filter(Number.isFinite);
 if(!vals.length)return '<div class="empty">Немає числових балів для побудови графіка.</div>';
 const min=Math.min(0,...vals),max=Math.max(...vals),span=max-min||1;
 const pts=rows.map((r,i)=>({x:L+(rows.length===1?(W-L-R)/2:i*(W-L-R)/(rows.length-1)),y:T+(H-T-B)-(Number(r.score)-min)/span*(H-T-B),score:Number(r.score),date:r.date}));
 const poly=pts.map(p=>p.x+","+p.y).join(" ");
 return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Графік динаміки балів"><line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="#dce5ef"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="#dce5ef"/>'+[0,.5,1].map(q=>{let y=T+q*(H-T-B);return '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#edf1f6"/>'}).join("")+(pts.length>1?'<polyline points="'+poly+'" fill="none" stroke="#315b8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':"")+pts.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="#315b8a"><title>'+esc(p.date)+': '+p.score+'</title></circle><text x="'+p.x+'" y="'+(p.y-11)+'" text-anchor="middle" font-size="12" fill="#243247">'+p.score+'</text><text x="'+p.x+'" y="'+(H-17)+'" text-anchor="middle" font-size="10" fill="#75849a">'+esc((p.date||"").slice(5))+'</text>').join("")+'</svg>';
}
const originalRender=render;
render=async function(){
 if(p==="clients"&&!selectedClientId){
  const c=$("#content");$("#crumb").textContent=labels.clients;
  try{const a=await data("clients");c.innerHTML=heading(labels.clients,"Ваші записи",add("clients"))+clientTable(a);c.querySelectorAll("[data-open-client]").forEach(b=>b.onclick=()=>openClient(b.dataset.openClient));c.querySelectorAll(".client-row").forEach(row=>row.onclick=e=>{if(!e.target.closest("button"))openClient(row.dataset.client)})}catch(e){c.innerHTML=heading(labels.clients,"Помилка завантаження")+'<div class="notice">'+esc(e.message)+'</div>'}
  return;
 }
 if(p==="clients"&&selectedClientId)return renderClientProfile();
 return originalRender();
};

boot();
</script></html>
